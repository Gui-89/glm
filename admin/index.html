<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GLM Universe — Admin</title>
<link rel="stylesheet" href="../style.css"/>

<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
    "firebase/storage":   "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js"
  }
}
</script>
<script type="module" src="admin.js"></script>
</head>
<body>
<div class="admin-root" id="admin-root">

  <!-- ═══ HEADER ═══ -->
  <header class="admin-header">
    <div class="admin-logo">GLM <span>UNIVERSE</span> <span style="color:rgba(255,255,255,.25);font-weight:400">/ ADMIN</span></div>
    <nav class="admin-nav" id="admin-nav" style="display:none">
      <a href="../index.html">← Ver site</a>
      <button class="admin-logout-btn" id="btn-logout">Sair</button>
    </nav>
  </header>

  <!-- ═══ LOGIN ═══ -->
  <div class="admin-login-wrap" id="view-login">
    <div class="admin-login-box">
      <div class="admin-login-icon">🔐</div>
      <h2>ACESSO RESTRITO</h2>
      <p>Apenas usuários autorizados podem acessar o painel.</p>
      <div class="admin-login-error" id="login-error"></div>
      <button class="btn-google" id="btn-google-login">
        <svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0">
          <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 19 13 24 13c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.8 13.5-4.7l-6.2-5.2C29.3 35.6 26.8 36 24 36c-5.2 0-9.7-2.9-11.3-7.1l-6.6 4.8C9.7 39.6 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C41 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/>
        </svg>
        Entrar com Google
      </button>
    </div>
  </div>

  <!-- ═══ PAINEL PRINCIPAL ═══ -->
  <div class="admin-content" id="view-panel" style="display:none">

    <!-- COLUNA ESQUERDA: formulário -->
    <aside class="admin-form-panel">
      <div class="panel-title" id="form-title">ADICIONAR PRODUTO</div>

      <!-- Upload de imagem -->
      <div class="img-upload-zone" id="upload-zone">
        <input type="file" id="file-input" accept="image/*"/>
        <div id="upload-placeholder">
          <div class="img-upload-icon">🖼️</div>
          <div class="img-upload-text">Clique ou arraste uma imagem</div>
          <div class="img-upload-text" style="font-size:9px;margin-top:4px;opacity:.3">JPG, PNG, WEBP — máx 5MB</div>
        </div>
        <img id="img-preview" class="img-preview" style="display:none"/>
        <button class="img-preview-clear" id="btn-clear-img" style="display:none" title="Remover imagem">✕</button>
      </div>

      <div class="field">
        <label>NOME DO PRODUTO</label>
        <input type="text" id="f-name" placeholder="Ex: Vaso Orgânico"/>
      </div>

      <div class="field">
        <label>PREÇO (R$)</label>
        <input type="number" id="f-price" placeholder="0.00" step="0.01" min="0"/>
      </div>

      <div class="field">
        <label>BADGE (opcional)</label>
        <input type="text" id="f-badge" placeholder="Ex: NOVO, TOP, PRO"/>
      </div>

      <div class="field">
        <label>EMOJI (fallback sem imagem)</label>
        <input type="text" id="f-emoji" placeholder="📦"/>
      </div>

      <div class="field">
        <label>DESCRIÇÃO</label>
        <textarea id="f-desc" placeholder="Breve descrição do produto…"></textarea>
      </div>

      <div class="field">
        <label>CATEGORIA</label>
        <div class="cat-pills">
          <label class="cat-pill">
            <input type="radio" name="cat" value="decor" checked/>
            <label>🌿 Essência Decor</label>
          </label>
          <label class="cat-pill">
            <input type="radio" name="cat" value="creative"/>
            <label>✦ 3D Creative</label>
          </label>
        </div>
      </div>

      <input type="hidden" id="f-edit-id"/>
      <input type="hidden" id="f-edit-img-url"/>

      <button class="btn-primary" id="btn-save">SALVAR PRODUTO</button>
      <button class="btn-secondary" id="btn-cancel-edit" style="display:none;width:100%;margin-top:8px;text-align:center">Cancelar edição</button>

      <div class="form-status" id="form-status"></div>
    </aside>

    <!-- COLUNA DIREITA: lista -->
    <main class="admin-list-panel">
      <div class="list-header">
        <div class="panel-title" style="margin:0">PRODUTOS CADASTRADOS</div>
        <span class="list-count" id="list-count">0 produtos</span>
      </div>

      <div class="admin-search">
        <span class="admin-search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar produto…"/>
      </div>

      <!-- filtro de categoria -->
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="filter-btn filter-active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="decor">🌿 Decor</button>
        <button class="filter-btn" data-filter="creative">✦ Creative</button>
      </div>

      <div class="product-list" id="product-list">
        <div class="loading-state"><div class="spinner"></div><p>Carregando…</p></div>
      </div>
    </main>
  </div>

</div>

<!-- Modal confirmação de exclusão -->
<div class="modal-overlay" id="modal-delete" style="display:none">
  <div class="modal-box">
    <h3>Excluir produto?</h3>
    <p id="modal-delete-name">Esta ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn-danger" id="modal-confirm">Excluir</button>
    </div>
  </div>
</div>
</body>
</html>
